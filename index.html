<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hi Vasu!!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
:root{--wine:#2a0a1f;--berry:#5a1238;--rose:#ff5c93;--blush:#ffd9e6;--gold:#ffcf70}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 30%,var(--berry) 0%,var(--wine) 75%);
  color:var(--blush);font-family:'Nunito',system-ui,sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
.dots{position:fixed;top:18px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:3}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,217,230,.25);transition:background .5s,transform .5s}
.dots i.on{background:var(--rose);transform:scale(1.3)}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .6s ease;z-index:2;
}
.screen.on{opacity:1;pointer-events:auto}
h1{
  font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;
  font-size:clamp(2.8rem,12vw,5.2rem);line-height:1.05;color:var(--blush);
}
h1 b{color:var(--rose);font-weight:600}
.sub{margin-top:.8rem;font-size:clamp(1.05rem,4vw,1.35rem);opacity:.85;min-height:1.6em}
.row{margin-top:2.2rem;display:flex;gap:18px;align-items:center;justify-content:center;min-height:64px}
button{
  font:inherit;font-size:1.2rem;border:0;border-radius:999px;padding:.85rem 2.2rem;cursor:pointer;
  transition:transform .25s ease,box-shadow .25s ease;
}
.yes,.go{background:var(--rose);color:#fff;box-shadow:0 8px 26px rgba(255,92,147,.45)}
.yes{transform:scale(var(--ys,1))}
.yes:hover,.go:hover{box-shadow:0 10px 34px rgba(255,92,147,.7)}
.go:hover{transform:scale(1.06)}
.yes:focus-visible,.no:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.no{
  background:transparent;color:var(--blush);border:2px solid rgba(255,217,230,.55);
  transform:scale(var(--ns,1));
}
.no.fly{position:fixed;z-index:10;transition:left .35s cubic-bezier(.3,1.4,.5,1),top .35s cubic-bezier(.3,1.4,.5,1),transform .3s}
.tease{margin-top:1.2rem;min-height:1.6em;color:var(--gold);font-size:1.1rem}
.wave{display:inline-block;animation:wave 1.6s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.bg span{position:absolute;bottom:-40px;color:var(--rose);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.35}100%{transform:translateY(-115vh) rotate(40deg);opacity:0}}
.fx{position:fixed;pointer-events:none;z-index:20}
.burst{font-size:1.4rem;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
.spark{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translateY(14px) scale(0);opacity:0}}
.drop{top:-30px;animation:drop var(--t) linear forwards}
@keyframes drop{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){
  .bg,.wave,.pulse{animation:none}
  .screen{transition-duration:.01s}
}
</style>
</head>
<body>

<div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="bg" id="bg" aria-hidden="true"></div>

<section class="screen">
  <h1>Hi <b>Vasu</b>!! <span class="wave">👋</span></h1>
  <p class="sub">I have something to ask you…</p>
  <div class="row"><button class="go" type="button">Okay, ask me</button></div>
</section>

<section class="screen">
  <h1>Are you free at 5?</h1>
  <p class="sub">Think carefully 🤔</p>
  <div class="row">
    <button class="yes" type="button">Yes</button>
    <button class="no" type="button">No</button>
  </div>
  <p class="tease" aria-live="polite"></p>
</section>

<section class="screen">
  <h1>Date? 💘</h1>
  <p class="sub">At 5pm</p>
  <div class="row">
    <button class="yes" type="button">Yes</button>
    <button class="no" type="button">No</button>
  </div>
  <p class="tease" aria-live="polite"></p>
</section>

<section class="screen">
  <h1 class="pulse">Get Ready !!</h1>
  <p class="sub">See you at 5pm, Vasu ✨</p>
</section>

<script>
(function () {
  var screens = Array.prototype.slice.call(document.querySelectorAll('.screen'));
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dots i'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cur = 0, locked = false;

  function go(n) {
    screens[cur].classList.remove('on');
    cur = n;
    screens[cur].classList.add('on');
    dots.forEach(function (d, i) { d.classList.toggle('on', i <= n); });
    locked = false;
    if (n === screens.length - 1) finale();
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function burst(x, y, emojis, count) {
    for (var i = 0; i < count; i++) {
      var s = document.createElement('div');
      s.className = 'fx burst';
      s.textContent = emojis[i % emojis.length];
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      var a = rand(0, Math.PI * 2), d = rand(60, 150);
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(s);
      setTimeout(function (el) { el.remove(); }, 950, s);
    }
  }

  /* first screen */
  screens[0].querySelector('.go').addEventListener('click', function (e) {
    if (locked) return;
    locked = true;
    var r = e.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, ['💖', '✨'], 10);
    setTimeout(function () { go(1); }, 450);
  });

  /* question screens */
  var teases = [
    'Nice try 😏', 'Too slow!', 'The No button is shy 🙈', 'Are you sure? 🥺',
    'Just say yes 💖', 'Catch me if you can!', 'Hehe, not today 😜', 'Wrong button, Vasu!'
  ];

  [1, 2].forEach(function (idx) {
    var scr = screens[idx];
    var yes = scr.querySelector('.yes');
    var no = scr.querySelector('.no');
    var tease = scr.querySelector('.tease');
    var dodges = 0;

    yes.addEventListener('click', function () {
      if (locked) return;
      locked = true;
      var r = yes.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, ['💖', '💕', '✨', '🌸'], 16);
      setTimeout(function () { go(idx + 1); }, 650);
    });

    function dodge(px, py) {
      var w = no.offsetWidth, h = no.offsetHeight, m = 14;
      if (!no.classList.contains('fly')) {
        var r = no.getBoundingClientRect();
        no.classList.add('fly');
        no.style.left = r.left + 'px';
        no.style.top = r.top + 'px';
        void no.offsetWidth;
      }
      var maxX = Math.max(m, window.innerWidth - w - m);
      var maxY = Math.max(m, window.innerHeight - h - m);
      var x = m, y = m;
      for (var t = 0; t < 40; t++) {
        x = rand(m, maxX);
        y = rand(m, maxY);
        var dx = x + w / 2 - px, dy = y + h / 2 - py;
        if (Math.sqrt(dx * dx + dy * dy) > 170) break;
      }
      no.style.left = x + 'px';
      no.style.top = y + 'px';

      dodges++;
      yes.style.setProperty('--ys', Math.min(1 + dodges * 0.08, 1.6));
      no.style.setProperty('--ns', Math.max(1 - dodges * 0.06, 0.65));
      tease.textContent = teases[(dodges - 1 + idx) % teases.length];
    }

    function center() {
      var r = no.getBoundingClientRect();
      return [r.left + r.width / 2, r.top + r.height / 2];
    }

    no.addEventListener('pointerenter', function (e) { dodge(e.clientX, e.clientY); });
    no.addEventListener('pointerdown', function (e) { e.preventDefault(); dodge(e.clientX, e.clientY); });
    no.addEventListener('click', function (e) {
      e.preventDefault();
      var c = center();
      dodge(c[0], c[1]);
    });
    no.addEventListener('focus', function () {
      var c = center();
      dodge(c[0], c[1]);
    });
  });

  /* finale */
  function finale() {
    if (reduce) return;
    var items = ['💖', '🌸', '✨', '💕', '🌷', '💗'];
    var n = 0;
    var timer = setInterval(function () {
      var d = document.createElement('div');
      d.className = 'fx drop';
      d.textContent = items[n % items.length];
      d.style.left = rand(0, 100) + 'vw';
      d.style.fontSize = rand(1.1, 2.1) + 'rem';
      d.style.setProperty('--t', rand(3, 5.5) + 's');
      d.style.setProperty('--dx', rand(-60, 60) + 'px');
      d.style.setProperty('--r', rand(-360, 360) + 'deg');
      document.body.appendChild(d);
      setTimeout(function (el) { el.remove(); }, 5600, d);
      if (++n > 90) clearInterval(timer);
    }, 90);
  }

  /* floating hearts in the background */
  if (!reduce) {
    var bg = document.getElementById('bg');
    for (var i = 0; i < 16; i++) {
      var h = document.createElement('span');
      h.textContent = '♥';
      h.style.left = rand(0, 100) + '%';
      h.style.fontSize = rand(14, 34) + 'px';
      h.style.animationDuration = rand(9, 18) + 's';
      h.style.animationDelay = rand(0, 12) + 's';
      bg.appendChild(h);
    }
  }

  /* sparkle trail */
  var last = 0;
  document.addEventListener('pointermove', function (e) {
    if (reduce) return;
    var now = Date.now();
    if (now - last < 70) return;
    last = now;
    var s = document.createElement('div');
    s.className = 'fx spark';
    s.style.left = e.clientX + 'px';
    s.style.top = e.clientY + 'px';
    document.body.appendChild(s);
    setTimeout(function (el) { el.remove(); }, 720, s);
  });

  go(0);
})();
</script>
</body>
</html>
